name: Auto-merge

# Turn on auto-merge for every ready pull request into main. GitHub then squash
# merges it on its own once the branch protection rule is satisfied: CodeRabbit
# has approved and the required checks (CodeRabbit, build) have passed. Drafts
# are left alone until they are marked ready for review.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]

# Enabling auto-merge needs write access to the pull request and its contents.
permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Fork pull requests get a read-only token, so skip them rather than fail.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
