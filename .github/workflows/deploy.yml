name: Deploy to GitHub Pages

# Manual only, until a host is chosen. GitHub Pages does not serve private
# repositories on the free plan, so an automatic run on every push to main would
# fail every time and bury real CI failures in the noise. Re-enable the push
# trigger once Pages is available (repo made public, or plan upgraded) — see the
# Deploying section of the README for the alternatives.
on:
  workflow_dispatch:

# Read the repo, write the Pages deployment, and mint the OIDC token the
# deploy-pages action exchanges — no long-lived secret is needed.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one rather than
# racing it. In-progress runs are left alone so a live deploy is never cancelled
# half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
